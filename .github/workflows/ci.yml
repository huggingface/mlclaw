name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: false
      - run: npm ci
      - run: npm run release:check
      - name: Build pinned HF Broker
        run: |
          hf_broker_version="$(node -p 'require("./package.json").config.hfBrokerVersion')"
          git init "$RUNNER_TEMP/unyolo"
          git -C "$RUNNER_TEMP/unyolo" fetch --depth=1 https://github.com/osolmaz/unyolo.git \
            "refs/tags/$hf_broker_version:refs/tags/$hf_broker_version"
          git -C "$RUNNER_TEMP/unyolo" checkout --detach "$hf_broker_version"
          test "$(git -C "$RUNNER_TEMP/unyolo" rev-parse "refs/tags/$hf_broker_version^{commit}")" = \
            "$(git -C "$RUNNER_TEMP/unyolo" rev-parse HEAD)"
          go build -C "$RUNNER_TEMP/unyolo" -o "$RUNNER_TEMP/hf-broker" ./brokers/huggingface/cmd/hf-broker
      - name: Test pinned unYOLO agent tools
        env:
          MLCLAW_HF_BROKER_BINARY: ${{ runner.temp }}/hf-broker
        run: npm test -- --run test/mlclaw.unyolo-agent-tools.test.ts
      - name: Install pinned OpenClaw integration package
        run: |
          openclaw_version="$(node -p 'require("./package.json").config.openclawVersion')"
          npm install --prefix "$RUNNER_TEMP/openclaw-integration" --ignore-scripts --no-audit --no-fund \
            "openclaw@$openclaw_version"
      - name: Test pinned OpenClaw integration
        env:
          MLCLAW_OPENCLAW_PACKAGE_DIR: ${{ runner.temp }}/openclaw-integration/node_modules/openclaw
        run: npm test -- --run test/mlclaw.openclaw-integration.test.ts
      - run: npm run build
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run coverage
      - run: npm run dry
      - name: Mutation tests (opt-in)
        if: ${{ vars.MLCLAW_RUN_MUTATION == '1' }}
        run: npm run mutate
      - run: npm run slophammer
      - run: npm run check:secrets
      - run: npm run pack:check
